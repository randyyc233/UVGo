services:
  mysql:
    image: mysql:8.4
    container_name: uvgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uvgo
      MYSQL_USER: uvgo
      MYSQL_PASSWORD: uvgo_dev_password
      MYSQL_ROOT_PASSWORD: uvgo_root_password
    ports:
      - "3307:3306"
    volumes:
      - uvgo_mysql_data:/var/lib/mysql
      - ./server/docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  uvgo_mysql_data:
